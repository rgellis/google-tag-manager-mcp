[project]
name = "google-tag-manager-mcp"
version = "0.1.0"
description = "MCP server with complete coverage of the Google Tag Manager API"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ryan Gellis" }]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0,<5",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.40.3",
    "google-auth-oauthlib>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "google-api-python-client-stubs>=1.40.0",
    "pyright>=1.1.402",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
indent-width = 4
fix = true
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E501", # line too long (handled by formatter)
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.coverage.run]
# Deliberately "src" and not also "main.py". Constructing a FastMCP instance
# inside a coverage-instrumented module trips a type check in cryptography's
# Rust bindings -- HKDF rejects a SHA256 that isinstance() accepts -- and
# main.py builds one at module scope. main.py is wiring and is covered
# end-to-end by tests/test_api_coverage.py and tests/test_tools.py instead.
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
# src is at 100% statement and branch coverage. Enforced rather than aspirational:
# this repo treats coverage as a contract, the same way tests/test_api_coverage.py
# treats API surface coverage.
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pyright]
include = ["src", "tests", "main.py"]
exclude = [".venv", "**/__pycache__", "build", "dist"]
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
reportMissingImports = true
reportMissingTypeStubs = false
reportMissingModuleSource = false
# google-api-python-client's build() overloads reference oauth2client, which is
# not installed and cannot be resolved, so every call through it reads as
# "partially unknown". Suppressed here rather than at ~106 call sites. The
# tagmanager stubs themselves are fully typed and still checked.
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownLambdaType = "none"
reportUnknownParameterType = "none"
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
reportInvalidTypeForm = "error"
reportUntypedFunctionDecorator = "warning"
reportUntypedClassDecorator = "warning"
reportImplicitOverride = "warning"
venvPath = "."
venv = ".venv"
